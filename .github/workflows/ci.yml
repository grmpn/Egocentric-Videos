name: CPU tests

on:
  pull_request:
  push:
    branches:
      - main
      - validation/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-contract-tests:
    name: Project contracts (CPU only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out the repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
          submodules: false

      - name: Check patches for whitespace errors
        run: git diff --check HEAD^ HEAD

      - name: Create the CPU test environment
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          miniforge-version: latest
          activate-environment: egocentric-cpu-tests
          environment-file: environment/cpu-tests.yml
          auto-activate: false

      - name: Verify checkout import and CPU environment
        run: |
          PYTHONPATH=src python - <<'PY'
          import importlib.util
          from pathlib import Path
          import egocentric_pipeline

          expected = Path("src/egocentric_pipeline/__init__.py").resolve()
          actual = Path(egocentric_pipeline.__file__).resolve()
          assert actual == expected, (actual, expected)
          assert importlib.util.find_spec("torch") is None, "CPU tests must not depend on Torch"
          print(actual)
          PY

      - name: Run the complete project test suite
        run: PYTHONPATH=src python -m pytest tests

  lerobot-integration:
    name: LeRobot create, append, and annotation (CPU fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install isolated dataset dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r environment/lerobot-requirements.txt
      - name: Exercise the production reader, writer, and annotation CLI
        run: PYTHONPATH=src python -m pytest tests/test_lerobot_export.py tests/test_canonical.py
